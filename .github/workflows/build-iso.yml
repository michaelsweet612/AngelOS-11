name: Build AngelOS 11 ISO

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: "Optional version override (defaults to VERSION file)"
        required: false
        default: ""
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve AngelOS 11 version
        id: meta
        run: |
          RAW_VER="${{ github.event.inputs.version_override }}"
          if [ -z "$RAW_VER" ]; then
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              RAW_VER="${GITHUB_REF_NAME#v}"
            else
              RAW_VER="$(tr -d '[:space:]' < VERSION)"
            fi
          fi
          echo "version=$RAW_VER" >> "$GITHUB_OUTPUT"
          echo "iso_name=angelos-11-v${RAW_VER}-x86_64.iso" >> "$GITHUB_OUTPUT"

      - name: Build ISO in Arch Linux container
        run: |
          mkdir -p out work
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/build" \
            -w /build \
            -e ANGELOS_VERSION="${{ steps.meta.outputs.version }}" \
            archlinux:latest \
            bash -c '
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Syu --noconfirm archiso
              ./scripts/build-iso.sh
            '

      - name: Generate SHA256 checksum
        run: |
          cd out
          sha256sum "${{ steps.meta.outputs.iso_name }}" > "${{ steps.meta.outputs.iso_name }}.sha256"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: angelos-11-v${{ steps.meta.outputs.version }}-iso
          path: |
            out/*.iso
            out/*.sha256
          retention-days: 14

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/*.sha256
          generate_release_notes: true
          prerelease: ${{ contains(steps.meta.outputs.version, '-') || startsWith(steps.meta.outputs.version, '0.') }}
