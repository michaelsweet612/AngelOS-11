# AngelOS 11 archiso pacman configuration
[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
# Prevent stock QML icontasks from shadowing our compiled Win11 C++ icontasks.so
NoExtract   = usr/share/plasma/plasmoids/org.kde.plasma.icontasks/*

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
